packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  '@nestjs/core': true
  '@swc/core': true
  cpu-features: true
  esbuild: true
  ssh2: true
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.2'
  - '@turbo/darwin-arm64@2.11.2'
  - '@turbo/linux-64@2.11.2'
  - '@turbo/linux-arm64@2.11.2'
  - '@turbo/windows-64@2.11.2'
  - '@turbo/windows-arm64@2.11.2'
  - turbo@2.11.2
  - '@aws-sdk/s3-request-presigner@3.1136.0'
  - '@aws-sdk/client-s3@3.1136.0'
