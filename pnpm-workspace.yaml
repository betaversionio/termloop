packages:
  - "packages/*"
  - "apps/*"
  - "marketplace-apps/*"
overrides:
  # Force a single react-router instance across the tree — nuqs's peer dependency was
  # resolving to a different copy (7.13.1) than react-router-dom actually uses (7.18.4),
  # so useNavigate() inside nuqs's adapter read from a React Context nothing ever provided.
  react-router: 7.18.4
allowBuilds:
  '@nestjs/core': true
  '@swc/core': true
  cpu-features: true
  esbuild: true
  ssh2: true
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.2'
  - '@turbo/darwin-arm64@2.11.2'
  - '@turbo/linux-64@2.11.2'
  - '@turbo/linux-arm64@2.11.2'
  - '@turbo/windows-64@2.11.2'
  - '@turbo/windows-arm64@2.11.2'
  - turbo@2.11.2
  - '@aws-sdk/s3-request-presigner@3.1136.0 || 3.1137.0'
  - '@aws-sdk/client-s3@3.1136.0 || 3.1137.0'
  - '@tanstack/query-core@5.103.2'
  - '@tanstack/react-query@5.103.2'
  - react-resizable-panels@4.13.2
  - '@nestjs/common@12.0.4'
  - '@nestjs/core@12.0.4'
  - '@nestjs/platform-express@12.0.4'
  - '@nestjs/platform-ws@12.0.4'
  - '@nestjs/websockets@12.0.4'
  - drizzle-orm@0.45.3
