name: Release npm Packages

# Tag formats (each triggers publishing just that package):
#   cli-v1.0.0         → termloop            (apps/cli)
#   create-app-v1.0.0  → create-termloop-app (apps/create-termloop-app)
#   react-v1.0.0       → @termloop/react     (packages/react)
on:
  push:
    tags:
      - 'cli-v*.*.*'
      - 'create-app-v*.*.*'
      - 'react-v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Needed to create the GitHub release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Resolve package from tag
        id: resolve
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          case "$REF" in
            cli-v*)
              echo "DIR=apps/cli" >> "$GITHUB_OUTPUT"
              echo "FILTER=termloop" >> "$GITHUB_OUTPUT"
              echo "VERSION=${REF#cli-v}" >> "$GITHUB_OUTPUT"
              echo "NEEDS_BUNDLE=true" >> "$GITHUB_OUTPUT"
              ;;
            create-app-v*)
              echo "DIR=apps/create-termloop-app" >> "$GITHUB_OUTPUT"
              echo "FILTER=create-termloop-app" >> "$GITHUB_OUTPUT"
              echo "VERSION=${REF#create-app-v}" >> "$GITHUB_OUTPUT"
              echo "NEEDS_BUNDLE=false" >> "$GITHUB_OUTPUT"
              ;;
            react-v*)
              echo "DIR=packages/react" >> "$GITHUB_OUTPUT"
              echo "FILTER=@termloop/react" >> "$GITHUB_OUTPUT"
              echo "VERSION=${REF#react-v}" >> "$GITHUB_OUTPUT"
              echo "NEEDS_BUNDLE=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unrecognized tag: $REF"
              exit 1
              ;;
          esac

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./${{ steps.resolve.outputs.DIR }}/package.json').version")
          if [ "$PKG_VERSION" != "${{ steps.resolve.outputs.VERSION }}" ]; then
            echo "Tag version (${{ steps.resolve.outputs.VERSION }}) does not match ${{ steps.resolve.outputs.DIR }}/package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Bundle CLI assets
        if: steps.resolve.outputs.NEEDS_BUNDLE == 'true'
        run: pnpm --filter termloop bundle

      - name: Publish to npm
        working-directory: ${{ steps.resolve.outputs.DIR }}
        run: pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref }}
          name: ${{ steps.resolve.outputs.FILTER }}@${{ steps.resolve.outputs.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
