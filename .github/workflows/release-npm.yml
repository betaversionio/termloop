name: Release npm Packages

# Tag formats (each triggers publishing just that package):
#   cli-v1.0.0         → termloop            (apps/cli)
#   create-app-v1.0.0  → create-termloop-app (apps/create-termloop-app)
#   react-v1.0.0       → @termloop/react     (packages/react)
on:
  push:
    tags:
      - 'cli-v*.*.*'
      - 'create-app-v*.*.*'
      - 'react-v*.*.*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to release'
        required: true
        type: choice
        options:
          - cli
          - create-app
          - react
      version:
        description: 'Version to release (e.g. 1.2.3), without the tag prefix'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Needed to create the GitHub release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve package and version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PACKAGE="${{ inputs.package }}"
            VERSION="${{ inputs.version }}"
          else
            REF="${GITHUB_REF#refs/tags/}"
            case "$REF" in
              cli-v*) PACKAGE="cli"; VERSION="${REF#cli-v}" ;;
              create-app-v*) PACKAGE="create-app"; VERSION="${REF#create-app-v}" ;;
              react-v*) PACKAGE="react"; VERSION="${REF#react-v}" ;;
              *)
                echo "Unrecognized tag: $REF"
                exit 1
                ;;
            esac
          fi

          case "$PACKAGE" in
            cli)
              echo "DIR=apps/cli" >> "$GITHUB_OUTPUT"
              echo "FILTER=termloop" >> "$GITHUB_OUTPUT"
              echo "TAG_PREFIX=cli-v" >> "$GITHUB_OUTPUT"
              echo "NEEDS_BUNDLE=true" >> "$GITHUB_OUTPUT"
              ;;
            create-app)
              echo "DIR=apps/create-termloop-app" >> "$GITHUB_OUTPUT"
              echo "FILTER=create-termloop-app" >> "$GITHUB_OUTPUT"
              echo "TAG_PREFIX=create-app-v" >> "$GITHUB_OUTPUT"
              echo "NEEDS_BUNDLE=false" >> "$GITHUB_OUTPUT"
              ;;
            react)
              echo "DIR=packages/react" >> "$GITHUB_OUTPUT"
              echo "FILTER=@termloop/react" >> "$GITHUB_OUTPUT"
              echo "TAG_PREFIX=react-v" >> "$GITHUB_OUTPUT"
              echo "NEEDS_BUNDLE=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unrecognized package: $PACKAGE"
              exit 1
              ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync package.json version
        run: |
          DIR="${{ steps.resolve.outputs.DIR }}"
          VERSION="${{ steps.resolve.outputs.VERSION }}"
          PKG_VERSION=$(node -p "require('./${DIR}/package.json').version")
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::warning::${DIR}/package.json was at $PKG_VERSION, not $VERSION — the version bump was forgotten before tagging. Updating it to match the tag before building/publishing."
            (cd "$DIR" && npm pkg set version="$VERSION")
          fi

      - name: Build
        run: pnpm build

      - name: Determine npm dist-tag
        id: npmtag
        run: |
          VERSION="${{ steps.resolve.outputs.VERSION }}"
          if [[ "$VERSION" == *-* ]]; then
            # Prerelease (e.g. 0.2.0-beta.0) — publish under its prerelease identifier's
            # dist-tag instead of "latest", so `npm install`/`npx` keeps resolving to the
            # last stable release for everyone not explicitly opting into the prerelease.
            TAG="${VERSION#*-}"
            TAG="${TAG%%.*}"
          else
            TAG="latest"
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "PRERELEASE=$([[ "$VERSION" == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Bundle CLI assets
        if: steps.resolve.outputs.NEEDS_BUNDLE == 'true'
        run: pnpm --filter termloop bundle

      - name: Publish to npm
        working-directory: ${{ steps.resolve.outputs.DIR }}
        run: pnpm publish --no-git-checks --access public --tag ${{ steps.npmtag.outputs.TAG }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.resolve.outputs.TAG_PREFIX }}${{ steps.resolve.outputs.VERSION }}
          name: ${{ steps.resolve.outputs.FILTER }}@${{ steps.resolve.outputs.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.npmtag.outputs.PRERELEASE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
