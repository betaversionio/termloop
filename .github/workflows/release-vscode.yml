name: Release VS Code Extension

# Tag format: vscode-v1.0.0 — must match apps/vscode-extension/package.json's "version".
on:
  push:
    tags:
      - 'vscode-v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3), without the tag prefix'
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Needed to create the GitHub release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF#refs/tags/vscode-v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync package.json version
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          PKG_VERSION=$(node -p "require('./apps/vscode-extension/package.json').version")
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::warning::apps/vscode-extension/package.json was at $PKG_VERSION, not $VERSION — the version bump was forgotten before tagging. Updating it to match before building/publishing."
            (cd apps/vscode-extension && npm pkg set version="$VERSION")
          fi

      - name: Build
        run: pnpm build

      - name: Package extension
        working-directory: apps/vscode-extension
        run: npx @vscode/vsce package --no-dependencies -o termloop-vscode-${{ steps.get_version.outputs.VERSION }}.vsix

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: vscode-v${{ steps.get_version.outputs.VERSION }}
          name: TermLoop for VS Code v${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: true
          body: |
            ## Installation

            ### From VSIX file
            1. Download `termloop-vscode-${{ steps.get_version.outputs.VERSION }}.vsix` from the assets below
            2. In VS Code, open the Extensions view (Ctrl+Shift+X / Cmd+Shift+X)
            3. Click the "..." menu → "Install from VSIX..."
            4. Select the downloaded file

            ### From the command line
            ```bash
            code --install-extension termloop-vscode-${{ steps.get_version.outputs.VERSION }}.vsix
            ```

            ## Support
            - 🐛 [Report Issues](https://github.com/betaversionio/termloop/issues)
            - ⭐ [Star on GitHub](https://github.com/betaversionio/termloop)
          draft: false
          prerelease: false
          files: |
            apps/vscode-extension/termloop-vscode-${{ steps.get_version.outputs.VERSION }}.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace
        working-directory: apps/vscode-extension
        run: |
          if [ -n "$VSCE_PAT" ]; then
            npx @vscode/vsce publish -p "$VSCE_PAT" --no-dependencies
            echo "✅ Published to VS Code Marketplace"
          else
            echo "⚠️ VSCE_PAT secret not set, skipping marketplace publish"
          fi
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
